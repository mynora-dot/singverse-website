      <stop offset="0" stop-color="#137CFF"/>
      <stop offset="0.5" stop-color="#0648CC"/>
      <stop offset="1" stop-color="#002D9D"/>
    </linearGradient>
    <linearGradient id="upperFold" gradientUnits="userSpaceOnUse" x1="372" y1="340" x2="919" y2="251">
