<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254">
  <title>SingVerse</title>
  <desc>Blue S ribbon, orbital band and one four-point star. Resolution-independent brand master.</desc>
