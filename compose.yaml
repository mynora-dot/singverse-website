name: singverse-website
services:
  website:
    image: ${WEBSITE_IMAGE:-singverse-website:local}
    build: .
    ports:
      - "${WEBSITE_BIND:-127.0.0.1}:${WEBSITE_PORT:-18081}:8080"
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
networks:
  default:
    driver: bridge
