name: SingVerse 官网镜像发布
run-name: 发布官网镜像 ${{ github.event.release.tag_name }}

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}
  GHCR_NAMESPACE: ${{ vars.GHCR_NAMESPACE }}
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}

concurrency:
  group: website-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: 锁定发布版本并检查推送配置
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.release.outputs.revision }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: 检出 Release 对应的源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 核对正式 Release 并锁定源码提交
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 infra/docker/resolve-release.py
      - name: 检出已锁定的源码提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.revision }}
          persist-credentials: false
      - name: 检查 GHCR 和 Docker Hub 的发布配置
        env:
          SINGVERSE_VERSION: ${{ steps.release.outputs.version }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 infra/docker/release.py validate

  build:
    name: 构建官网镜像（${{ matrix.arch }}）
    needs: preflight
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_REVISION: ${{ needs.preflight.outputs.revision }}
      SINGVERSE_VERSION: ${{ needs.preflight.outputs.version }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: 检出已锁定的源码提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.revision }}
          persist-credentials: false
      - name: 准备镜像复制工具 Skopeo
        run: |
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends skopeo
          fi
      - name: 登录 GHCR 以访问发布归档和构建缓存
        run: |
          printf '%s' "$GHCR_TOKEN" | skopeo login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
      - name: 从 GHCR 恢复已构建的发布镜像
        id: archive
        env:
          ARCH: ${{ matrix.arch }}
        run: python3 infra/docker/release-artifact.py restore --name "website-$ARCH.oci.tar"
      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.archive.outputs.found != 'true'
      - name: 构建官网镜像并导出 OCI 归档
        if: steps.archive.outputs.found != 'true'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          namespace="${GHCR_NAMESPACE:-${GITHUB_REPOSITORY_OWNER,,}}"
          cache="ghcr.io/$namespace/singverse-website-buildcache:$ARCH"
          docker buildx build --file Dockerfile --target runtime \
            --platform "linux/$ARCH" \
            --build-arg "SINGVERSE_VERSION=$SINGVERSE_VERSION" \
            --build-arg "SOURCE_REVISION=$SOURCE_REVISION" \
            --build-arg "SOURCE_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --cache-from "type=registry,ref=$cache" \
            --cache-to "type=registry,ref=$cache,mode=max,ignore-error=true" \
            --progress=plain --provenance=false --tag singverse-website:build \
            --output type=oci,dest=/tmp/image.tar .
      - name: 导出后清理本地构建缓存
        if: steps.archive.outputs.found != 'true'
        run: docker buildx prune --all --force
      - name: 将固定摘要的镜像保存到 GHCR 以便重试
        if: steps.archive.outputs.found != 'true'
        env:
          ARCH: ${{ matrix.arch }}
        run: python3 infra/docker/release-artifact.py save --name "website-$ARCH.oci.tar"

  publish:
    name: 发布多架构官网镜像
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_REVISION: ${{ needs.preflight.outputs.revision }}
      SINGVERSE_VERSION: ${{ needs.preflight.outputs.version }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: 检出已锁定的源码提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.revision }}
          persist-credentials: false
      - name: 准备镜像复制工具 Skopeo
        run: |
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends skopeo
          fi
      - name: 登录 GHCR 和 Docker Hub
        run: |
          printf '%s' "$GHCR_TOKEN" | skopeo login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          printf '%s' "$DOCKERHUB_TOKEN" | skopeo login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: 从 GHCR 恢复两个架构的发布镜像
        run: |
          for arch in amd64 arm64; do
            python3 infra/docker/release-artifact.py restore --name "website-$arch.oci.tar" \
              --archive "artifacts/website-$arch/image.tar"
          done
      - name: 向两个镜像仓库发布固定版本，再更新 latest 标签
        run: python3 -u infra/docker/release.py publish --artifacts artifacts
