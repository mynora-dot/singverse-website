worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format website '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout website;
    sendfile on;
    keepalive_timeout 15;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    client_max_body_size 1k;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        # Keep redirects relative when an outer proxy terminates HTTPS.
        absolute_redirect off;
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;
        expires -1;
        include /etc/nginx/security-headers.conf;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        location = /healthz { access_log off; return 200 "ok\n"; }
        location = /docs { return 308 /docs/index.html; }
        location ~ (^|/)\. { return 404; }
        location /_astro/ { expires 1y; try_files $uri =404; }
        location /assets/ { expires 1d; try_files $uri =404; }
        # Original *.html links and Starlight clean links resolve to real files.
        location / { try_files $uri $uri.html $uri/index.html =404; }
        error_page 404 /404.html;
    }
}
